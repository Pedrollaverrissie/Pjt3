<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>

        body{
            margin:0;
            font-family:Arial, Helvetica, sans-serif;
            background:linear-gradient(135deg,#000000,#000000);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }


        .reset-card{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width:320px;
            max-width:90%;
            background: rgb(24, 10, 42);
            border-radius:20px;
            border: 2px solid white;
            padding:10px;
            box-shadow:0 20px 45px rgba(0,0,0,.35);

        }

        .logo2{

            text-align:center;
            margin-bottom:20px;

        }

        .logo2 img{

            width:90px;

        }

        h2{

            text-align:center;
            color:#16b364;
            margin-bottom:4px;
               font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;

        }

        .subtitle{
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            text-align:center;
            color:#f9f7f7;
            margin-bottom:20px;
            font-size:16px;

        }
        form{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 94%;
        }
        form label{
            align-self: first baseline;
            margin-left: 2%;
        }
        label{

            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#fdfbfb;
            text-align:left;

        }

        input{

            width:96%;
            padding:14px;
            border:1px solid #d7d7d7;
            border-radius:10px;
            margin-bottom:20px;
            font-size:15px;
            box-sizing:border-box;
          

        }

        input:focus{

            outline:none;
            border-color:#0d6efd;
            box-shadow:0 0 10px rgba(13,110,253,.2);

        }

        button{

            width:96%;
            padding:15px;
            border:none;
            border-radius:10px;
            background:#16b364;
            color:white;
            font-size:17px;

            font-weight:bold;
            cursor:pointer;
            transition:.3s;
            margin-bottom: 40px;

        }

        button:hover{

            background:#119455;

        }

    </style>

</head>
<body>

<div class="reset-card">

    <div class="logo2">
       <img src="{{ url_for('static', filename='images/supernova earn logo.png') }}" alt="Supernova Earn Logo">
    </div>

    <h2>Reset Password</h2>

    <p class="subtitle">
        Create a new password<br>
        <strong style=" color:rgb(234, 179, 8); font-size: 10px;">{{ email }}</strong>
    </p>

    <form method="POST">

        <label>New Password</label>

        <input
            type="password"
            name="new_password"
            placeholder="Enter new password"
            autocomplete="new-password"
            required
        >

        <label>Confirm Password</label>

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm new password"
            autocomplete="new-password"
            required
        >

        <button type="submit">
            Reset Password
        </button>

    </form>

</div>

</body>
</html>
