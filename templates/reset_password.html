<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>

        body{
            margin:0;
            font-family:Arial, Helvetica, sans-serif;
            background:linear-gradient(135deg,#08142b,#000000);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }


        .reset-card{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width:380px;
            max-width:90%;
            background: rgb(24, 10, 42);
            border-radius:14px;
            border: 2px solid white;
            padding:10px;
            box-shadow:0 20px 45px rgba(0,0,0,.35);

        }

        .logo{

            text-align:center;
            margin-bottom:20px;

        }

        .logo img{

            width:90px;

        }

        h2{

            text-align:left;
            color:#0d6efd;
            margin-bottom:8px;

        }

        .subtitle{

            text-align:center;
            color:#666;
            margin-bottom:30px;
            font-size:15px;

        }
        form{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 90%;
        }
        form.label{
            text-align:left; 
        }
        label{

            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#333;
            text-align:left;

        }

        input{

            width:80%;
            padding:14px;
            border:1px solid #d7d7d7;
            border-radius:10px;
            margin-bottom:20px;
            font-size:15px;
            box-sizing:border-box;
          

        }

        input:focus{

            outline:none;
            border-color:#0d6efd;
            box-shadow:0 0 10px rgba(13,110,253,.2);

        }

        button{

            width:80%;
            padding:15px;
            border:none;
            border-radius:10px;
            background:#16b364;
            color:white;
            font-size:17px;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
            margin-bottom: 20px;

        }

        button:hover{

            background:#119455;

        }

    </style>

</head>
<body>

<div class="reset-card">

    <div class="logo">
        <img src="static/images/supernova earn logo.png" alt="">
    </div>

    <h2>Reset Password</h2>

    <p class="subtitle">
        Create a new password for<br>
        <strong>{{ email }}</strong>
    </p>

    <form method="POST">

        <label>New Password</label>

        <input
            type="password"
            name="new_password"
            placeholder="Enter new password"
            autocomplete="new-password"
            required
        >

        <label>Confirm Password</label>

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm new password"
            autocomplete="new-password"
            required
        >

        <button type="submit">
            Reset Password
        </button>

    </form>

</div>

</body>
</html>
