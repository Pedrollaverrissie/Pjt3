<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>

        body{
            margin:0;
            font-family:Arial, Helvetica, sans-serif;
            background:linear-gradient(135deg,#000000,#000000);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }


        .reset-card{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width:320px;
            max-width:90%;
            background: rgb(24, 10, 42);
            border-radius:20px;
            border: 1px solid white;
            padding:10px;
            box-shadow:0 20px 45px rgba(0,0,0,.35);

        }

        .logo2{

            text-align:center;
            margin-bottom:5px;

        }

        .logo2 img{

            width:50px;
            border-radius:20% 10%;

        }

        h2{
            margin: 0;
            text-align:center;
            color:#16b364;
            
               font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;

        }

        .subtitle{
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            text-align:center;
            color:#f9f7f7;
            margin-bottom:20px;
            font-size:16px;

        }
        form{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 94%;
        }
        form label{
            align-self: first baseline;
            margin-left: 2%;
        }
        label{

            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#fdfbfb;
            text-align:left;

        }

        input{

            width:96%;
            padding:14px;
            border:1px solid #d7d7d7;
            border-radius:10px;
            margin-bottom:20px;
            font-size:15px;
            box-sizing:border-box;
          

        }

        input:focus{

            outline:none;
            border-color:#0d6efd;
            box-shadow:0 0 10px rgba(13,110,253,.2);

        }

        button{

            width:96%;
            padding:15px;
            border:none;
            border-radius:10px;
            background:#16b364;
            color:white;
            font-size:17px;

            font-weight:bold;
            cursor:pointer;
            transition:.3s;
            margin-bottom: 40px;

        }

        button:hover{

            background:#119455;

        }
        .password-box{

    position:relative;
    width:96%;
    margin-bottom:20px;

}

.password-box input{

    width:100%;
    margin-bottom:0;
    padding-right:50px;

}

.toggle-password{

    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    font-size:18px;
    color:#555;
    user-select:none;

}

.toggle-password:hover{

    color:#16b364;

}
/* ==========================
   PASSWORD POPUP
========================== */

.popup-overlay{

    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;

    display:none;

    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,.65);
    backdrop-filter:blur(6px);

    z-index:9999;

}

.popup-card{

    width:300px;
    max-width:80%;

     background:#111827;
     box-shadow:0 0 8px rgb(202, 200, 200);

    border:0.3px solid white;

    border-radius:20px;

    padding:10px;

    text-align:center;

    animation:popup .3s ease;

}

.popup-icon{

    width:55px;
    height:55px;

    border-radius:50%;

    margin:auto;
    margin-bottom:20px;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#ff4d4d;

    color:white;

    font-size:40px;
    font-weight:bold;

    box-shadow:0 0 20px rgba(255,77,77,.6);

}

.popup-card h3{

    color:#ff4d4d;
    margin-bottom:4px;

}

.popup-card p{

    color:white;
    line-height:1.6;

}

.popup-card button{

    width:90%;
    margin-top:15px;

}

@keyframes popup{

    from{

        opacity:0;
        transform:scale(.8);

    }

    to{

        opacity:1;
        transform:scale(1);

    }

}
    </style>

</head>
<body>

<div class="reset-card">

    <div class="logo2">
       <img src="{{ url_for('static', filename='images/supernova earn logo.png') }}" alt="Supernova Earn Logo">
    </div>

    <h2>Reset Password</h2>

    <p class="subtitle">
        Create a new password<br>
        <strong style=" color:rgb(234, 179, 8); font-size: 10px;">{{ email }}</strong>
    </p>

    <form method="POST">

        <label>New Password</label>

        <div class="password-box">

            <input
                type="password"
                id="new_password"
                name="new_password"
                placeholder="Enter new password"
                autocomplete="new-password"
                required
            >

        <span
            class="toggle-password"
            onclick="togglePassword('new_password', this)">
            <i class="fa-solid fa-eye"></i>
        </span>

        </div>

        <label>Confirm Password</label>

        <div class="password-box">

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm new password"
                autocomplete="new-password"
                required
            >

            <span
                class="toggle-password"
                onclick="togglePassword('new_password', this)">
                <i class="fa-solid fa-eye"></i>
            </span>

        </div>

        <button type="submit">
            Reset Password
        </button>

    </form>

</div>
<div id="passwordPopup" class="popup-overlay">

    <div class="popup-card">

        <div class="popup-icon">
            ⚠
        </div>

        <h3>Password Mismatch</h3>

        <p>
            The passwords you entered do not match.
            Please try again.
        </p>

        <button onclick="closePopup()">
            OK
        </button>

    </div>

</div>

<script>

function togglePassword(id, icon){

    const input = document.getElementById(id);
    const eye = icon.querySelector("i");

    if(input.type === "password"){

        input.type = "text";

        eye.classList.remove("fa-eye");
        eye.classList.add("fa-eye-slash");

    }else{

        input.type = "password";

        eye.classList.remove("fa-eye-slash");
        eye.classList.add("fa-eye");

    }

}
</script>

<script>

function closePopup(){

    document.getElementById("passwordPopup").style.display = "none";

}

{% if password_error %}

window.onload = function(){

    document.getElementById("passwordPopup").style.display = "flex";

}

{% endif %}

</script>
</body>
</html>
