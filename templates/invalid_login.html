<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Failed</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

background:linear-gradient(
135deg,
#071122,
#0c1d3d,
#162a55
);

overflow:hidden;

position:relative;

}

/* Glow Background */

body::before,
body::after{

content:"";

position:fixed;

border-radius:50%;

filter:blur(120px);

opacity:.35;

z-index:-1;

}

body::before{

width:320px;
height:320px;

background:#00d9ff;

top:-120px;
left:-120px;

}

body::after{

width:300px;
height:300px;

background:#ff00b3;

bottom:-100px;
right:-100px;

}
/* Card */

.container{

width:90%;
max-width:430px;

padding:35px;

border-radius:25px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.08);

box-shadow:
0 20px 60px rgba(0,0,0,.45);

text-align:center;

animation:fadeIn .5s ease;

}

/* Icon */

.icon{

width:90px;

height:90px;

margin:auto;

margin-bottom:25px;

border-radius:50%;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(
135deg,
#ffb000,
#ff6b00
);

color:white;

font-size:42px;

box-shadow:
0 0 25px rgba(255,176,0,.45);

}

/* Title */

h1{

color:#FFD54A;

font-size:30px;

margin-bottom:15px;

font-weight:700;

}

/* Message */

p{

color:#d8dff5;

font-size:15px;

line-height:1.8;

margin-bottom:30px;

}

/* Button */

.btn{

display:inline-block;

width:100%;

padding:16px;

border-radius:14px;

text-decoration:none;

font-size:17px;

font-weight:600;

background:linear-gradient(
135deg,
#00d9ff,
#0077ff
);

color:white;

transition:.35s;

box-shadow:
0 10px 30px rgba(0,217,255,.35);

}

.btn:hover{

transform:translateY(-4px);

box-shadow:
0 15px 35px rgba(0,217,255,.55);

}

/* Footer */

.footer{

margin-top:25px;

font-size:13px;

color:#8aa7ff;

}

/* Animation */

@keyframes fadeIn{

from{

opacity:0;

transform:translateY(30px) scale(.95);

}

to{

opacity:1;

transform:translateY(0) scale(1);

}

}

/* Mobile */

@media(max-width:600px){

.container{

padding:30px 22px;

}

h1{

font-size:25px;

}

.icon{

width:80px;
height:80px;
font-size:36px;

}

.btn{

font-size:16px;

}

}
</style>


</head>
<body>

<div class="container">

<div class="icon">
    🔒
</div>

    <h1>Login Failed</h1>

    <p>
        The username, email, or password you entered is incorrect.
        Please verify your credentials and try again.
    </p>

    <a href="{{ url_for('login') }}" class="btn">
        Back to Login
    </a>

    <div class="footer">
        Secure Account Authentication
    </div>

</div>


</body>
</html>
