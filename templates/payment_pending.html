<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment Processing</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    font-family:
        Arial,
        sans-serif;

    background:#020202;

    color:#ffffff;
}


/* ===============================
   PAYMENT CARD
================================ */

.payment-card{
    width:100%;
    max-width:430px;

    background:#071017;

    border:1px solid #1c2b2f;

    border-radius:12px;

    padding:38px 32px 30px;

    text-align:center;

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.55);
}


/* ===============================
   PAYMENT ICON
================================ */

.payment-icon{
    width:64px;
    height:64px;

    margin:0 auto 22px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:12px;

    background:#0b1b1d;

    border:1px solid
        rgba(220,248,3,.25);
}

.payment-icon span{
    font-size:28px;
}


/* ===============================
   TITLE
================================ */

h2{
    margin:0;

    font-family:
        Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;

    font-size: 25px;

    color:#fffffd;

    font-weight:700;
}


/* ===============================
   SUBTITLE
================================ */

.subtitle{
    max-width:340px;

    margin:13px auto 0;

    color:#aab3b5;

    font-size:14px;

    line-height:1.7;
}


/* ===============================
   LOADER
================================ */

.loader-wrapper{
    position:relative;

    width:70px;
    height:70px;

    margin:30px auto 25px;
}


.loader{
    width:70px;
    height:70px;

    border-radius:50%;

    border:4px solid #172326;

    border-top-color:#dcf803;

    animation:
        spin .9s linear infinite;
}


.loader-inner{
    position:absolute;

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%);

    width:26px;
    height:26px;

    border-radius:50%;

    background:#101b1b;

    border:1px solid
        rgba(220,248,3,.25);
}


.loader-inner::after{
    content:"";

    position:absolute;

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%);

    width:7px;
    height:7px;

    border-radius:50%;

    background:#dcf803;
}


/* ===============================
   STATUS
================================ */

#status{
    min-height:52px;

    margin:0;

    padding:14px 16px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#0a1519;

    border-left:3px solid #dcf803;

    border-radius:6px;

    color:#d7dddd;

    font-size:14px;

    font-weight:600;

    line-height:1.5;
}


/* ===============================
   PAYMENT STEPS
================================ */

.steps{
    display:flex;

    justify-content:space-between;

    margin:32px 0 25px;
}


.step{
    flex:1;

    position:relative;

    text-align:center;
}


.step:not(:last-child)::after{
    content:"";

    position:absolute;

    top:13px;

    left:60%;

    width:80%;

    height:1px;

    background:#273235;
}


.step-circle{
    position:relative;

    z-index:2;

    width:27px;
    height:27px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#0b1518;

    border:1px solid #2a3538;

    color:#758083;

    font-size:11px;

    font-weight:bold;
}


.step.active .step-circle{
    background:#16200a;

    border-color:#dcf803;

    color:#dcf803;
}


.step-text{
    margin-top:8px;

    color:#697477;

    font-size:10px;
}


.step.active .step-text{
    color:#dce5e6;
}


/* ===============================
   SECURITY
================================ */

.security{
    padding-top:20px;

    border-top:
        1px solid #1b282b;

    color:#687477;

    font-size:11px;

    line-height:1.7;
}


.security-icon{
    margin-right:5px;
}


/* ===============================
   ANIMATION
================================ */

@keyframes spin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}


/* ===============================
   MOBILE
================================ */

@media(max-width:480px){

    body{
        padding:15px;
    }

    .payment-card{
        padding:32px 22px 27px;

        border-radius:10px;
    }

    h2{
        font-size:24px;
    }

    .payment-icon{
        width:58px;
        height:58px;
    }

    .payment-icon span{
        font-size:25px;
    }

    .loader-wrapper,
    .loader{
        width:64px;
        height:64px;
    }

}
@media(min-width:300px){
    .payment-card{
        zoom: 80%;
        border-radius: 24px;
    }
}
</style>
</head>


<body>


<div class="payment-card">


    <!-- PAYMENT ICON -->

    <div class="payment-icon">

        <span>📱</span>

    </div>


    <!-- TITLE -->

    <h2>

        Complete Your Payment

    </h2>


    <p class="subtitle">

        A payment request has been sent to your phone.

        Enter your M-Pesa PIN to authorize the transaction.

    </p>


    <!-- LOADER -->

    <div class="loader-wrapper">

        <div class="loader"></div>

        <div class="loader-inner"></div>

    </div>


    <!-- STATUS -->

    <p id="status">

        Waiting for payment confirmation...

    </p>


    <!-- STEPS -->

    <div class="steps">

        <div class="step active" id="step1">

            <div class="step-circle">
                ✓
            </div>

            <div class="step-text">
                Request Sent
            </div>

        </div>


        <div class="step" id="step2">

            <div class="step-circle">
                2
            </div>

            <div class="step-text">
                Confirm PIN
            </div>

        </div>


        <div class="step" id="step3">

            <div class="step-circle">
                3
            </div>

            <div class="step-text">
                Completed
            </div>

        </div>

    </div>


    <!-- SECURITY -->

    <div class="security">

        <span class="security-icon">🔒</span>

        Secure payment processing

        <br>

        Please keep this page open until your payment is confirmed.

    </div>


</div>

<script>
    function updateSteps(status) {

    const step1 = document.getElementById("step1");
    const step2 = document.getElementById("step2");
    const step3 = document.getElementById("step3");

    const circle1 = step1.querySelector(".step-circle");
    const circle2 = step2.querySelector(".step-circle");
    const circle3 = step3.querySelector(".step-circle");


    // Reset
    step1.classList.remove("active");
    step2.classList.remove("active");
    step3.classList.remove("active");


    // PAYMENT REQUEST SENT
    if (status === "pending") {

        step1.classList.add("active");

        circle1.innerText = "✓";
        circle2.innerText = "2";
        circle3.innerText = "3";

    }


    // PAYMENT PROCESSING
    else if (status === "processing") {

        step1.classList.add("active");
        step2.classList.add("active");

        circle1.innerText = "✓";
        circle2.innerText = "✓";
        circle3.innerText = "3";

    }


    // PAYMENT SUCCESSFUL
    else if (status === "approved") {

        step1.classList.add("active");
        step2.classList.add("active");
        step3.classList.add("active");

        circle1.innerText = "✓";
        circle2.innerText = "✓";
        circle3.innerText = "✓";

    }


    // PAYMENT FAILED
    else if (status === "failed") {

        step1.classList.add("active");

        circle1.innerText = "✓";
        circle2.innerText = "!";
        circle3.innerText = "3";

    }

}
</script>

<script>

const invoiceId = "{{ invoice_id }}";

const statusElement =
    document.getElementById("status");

const paymentType =
    "{{ payment_type }}";

const purpose =
    "{{ purpose or '' }}";


setInterval(() => {

    fetch(`/check-payment/${invoiceId}`)

    .then(response => response.json())

    .then(data => {

        updateSteps(data.status);


        if(data.status === "pending"){

            statusElement.innerText =
                "Waiting for payment confirmation...";

        }


        else if(data.status === "processing"){

            statusElement.innerText =
                "Processing your payment...";

        }


        else if(data.status === "approved"){

            statusElement.innerText =
                "Payment successful! Redirecting...";


            setTimeout(() => {

                if(paymentType === "recharge"){

                    if(purpose === "renewal"){

                        window.location.href =
                            "/vip";

                    }

                    else{

                        window.location.href =
                            "/dashboard";

                    }

                }

                else{

                    window.location.href =
                        "/login";

                }

            },2000);

        }


        else if(data.status === "failed"){

            statusElement.innerText =
                "Payment cancelled or failed.";


            setTimeout(() => {

                if(paymentType === "recharge"){

                    if(purpose === "renewal"){

                        window.location.href =
                            "/recharge?purpose=renewal";

                    }

                    else{

                        window.location.href =
                            "/recharge";

                    }

                }

                else{

                    window.location.href =
                        "/payment";

                }

            },3000);

        }


        else if(data.status === "not_found"){

            statusElement.innerText =
                "Payment record not found.";

        }


        else{

            statusElement.innerText =
                "Status: " + data.status;

        }

    })


    .catch(error => {

        console.error(error);

        statusElement.innerText =
            "Connection error. Retrying...";

    });


},4000);

</script>


</body>

</html>
