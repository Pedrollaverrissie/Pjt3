<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agreement Required</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <script src="{{ url_for('static', filename='script.js') }}"></script>

    <style>
        /*================ AGREEMENT PAGE =================*/

.agreement-page{

    margin:0;

    display:flex;

    justify-content:center;

    align-items:center;

    height:100vh;

    background:linear-gradient(135deg,#08141d,#0f1d29);

    font-family:Arial,sans-serif;

}

.agreement-alert-box{

    position:relative;

    width:340px;

    max-width:82%;

    background:white;

    border-radius:22px;

    padding:30px 22px;

    text-align:center;

    box-shadow:0 20px 60px rgba(0,0,0,.35);

    animation:agreementPop .4s ease;

}
@media(max-width:768px){

.agreement-alert-box{

    width:300px;

    max-width:80%;

    padding:25px 18px;

    border-radius:18px;

}

.agreement-alert-box img{

    width:70px;

    height:70px;

}

.agreement-alert-box h2{

    font-size:22px;

}

.agreement-alert-box p{

    font-size:14px;

    line-height:1.6;

}

.agreement-return-btn{

    width:100%;

    padding:12px;

    font-size:15px;

}

}
.agreement-alert-box img{

    width:90px;

    height:90px;

    object-fit:cover;

    border-radius:50%;

    margin-bottom:20px;

}

.agreement-alert-box h2{

    color:#d32f2f;

    margin-bottom:15px;

    font-size:28px;

}

.agreement-alert-box p{

    color:#555;

    line-height:1.8;

    margin-bottom:30px;

    font-size:16px;

}

.agreement-return-btn{

    display:inline-block;

    text-decoration:none;

    background:#16b364;

    color:white;

    padding:14px 30px;

    border-radius:10px;

    font-weight:bold;

    transition:.3s;

}

.agreement-return-btn:hover{

    background:#129b56;

    transform:translateY(-2px);

}

.agreement-close-btn{

    position:absolute;

    top:15px;

    right:15px;

    width:36px;

    height:36px;

    border:none;

    border-radius:50%;

    background:#f5f5f5;

    color:#555;

    font-size:24px;

    cursor:pointer;

    transition:.3s;

}

.agreement-close-btn:hover{

    background:#d32f2f;

    color:white;

    transform:rotate(90deg);

}

@keyframes agreementPop{

    from{

        opacity:0;

        transform:scale(.8);

    }

    to{

        opacity:1;

        transform:scale(1);

    }

}
    </style>

</head>

<body class="agreement-page">

    <div class="agreement-alert-box">

        <button class="agreement-close-btn" onclick="window.location.href='/signup'">

            &times;

        </button>

        <img src="{{ url_for('static', filename='images/alert.jfif') }}" alt="Alert">

        <h2>Action Required</h2>

        <p>

            You must agree to the <strong>Terms & Conditions</strong> before you can continue with registration.

        </p>

        <a href="/signup" class="agreement-return-btn">

            Return to Registration

        </a>

    </div>

</body>

</html>
