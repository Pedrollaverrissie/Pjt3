<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agreement Required</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <script src="{{ url_for('static', filename='script.js') }}"></script>

    <style>
/*================ AGREEMENT OVERLAY =================*/

.agreement-page{

    margin:0;

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

    background:rgba(0,0,0,.55);

    backdrop-filter:blur(8px);

    -webkit-backdrop-filter:blur(8px);

    overflow:hidden;

}

.agreement-alert-box{

    position:relative;

    width:320px;

    max-width:82%;

    background:#ffffff;

    border-radius:20px;

    padding:28px 22px;

    text-align:center;

    box-shadow:

        0 25px 60px rgba(0,0,0,.35),

        0 0 25px rgba(22,179,100,.18);

    animation:agreementPopup .45s cubic-bezier(.22,1,.36,1);

}
@media(max-width:768px){

.agreement-alert-box{

    width:300px;

    max-width:80%;

    padding:25px 18px;

    border-radius:18px;

}

.agreement-alert-box img{

    width:70px;

    height:70px;

}

.agreement-alert-box h2{

    font-size:22px;

}

.agreement-alert-box p{

    font-size:14px;

    line-height:1.6;

}

.agreement-return-btn{

    width:60%;
    text-align: center;
    padding:5px;

    font-size:15px;

}

}
.agreement-alert-box img{

    width:75px;

    height:75px;

    object-fit:cover;

    border-radius:50%;

    border:5px solid #fff;

    margin-top:-65px;

    box-shadow:0 10px 25px rgba(0,0,0,.25);

}

.agreement-alert-box h2{

    color:#d32f2f;

    margin-bottom:15px;

    font-size:28px;

}

.agreement-alert-box p{

    color:#555;

    line-height:1.8;

    margin-bottom:30px;

    font-size:16px;

}

.agreement-return-btn{

    display:flex;

    justify-content:center;

    align-items:center;

    width:100%;

    height:52px;

    margin:20px auto 0;

    background:#16b364;

    color:#fff;

    text-decoration:none;

    border-radius:12px;

    font-size:16px;

    font-weight:600;

    transition:.3s;

    text-align:center;

}

.agreement-return-btn:hover{

    background:#119455;

    transform:translateY(-2px);

    box-shadow:0 10px 20px rgba(22,179,100,.35);

}


.agreement-close-btn{

    position:absolute;

    top:15px;

    right:15px;

    width:34px;

    height:34px;

    border:none;

    border-radius:50%;

    background:#f3f3f3;

    font-size:22px;

    cursor:pointer;

    transition:.35s;

}

.agreement-close-btn:hover{

    background:#e53935;

    color:white;

    transform:rotate(90deg);

}

@keyframes agreementPopup{

    0%{

        opacity:0;

        transform:translateY(40px) scale(.85);

    }

    100%{

        opacity:1;

        transform:translateY(0) scale(1);

    }

}
    </style>

</head>

<body class="agreement-page">

    <div class="agreement-alert-box">

        <button class="agreement-close-btn" onclick="window.location.href='/signup'">

            &times;

        </button>

        <img src="{{ url_for('static', filename='images/alert.jfif') }}" alt="Alert">

        <h2>Action Required</h2>

        <p>

            You must agree to the <strong>Terms & Conditions</strong> before you can continue with registration.

        </p>

        <a href="/signup" class="agreement-return-btn">

            Return to Registration

        </a>

    </div>

</body>

</html>
