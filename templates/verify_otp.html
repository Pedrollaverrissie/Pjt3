<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verify OTP</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

<style>

body{

    margin:0;
    font-family:Arial,Helvetica,sans-serif;

    background:#000;

    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;

}

.verify-card{

    width:380px;
    max-width:95%;

    background:rgb(24,10,42);

    border:1px solid white;

    border-radius:22px;

    padding:35px 25px;

    text-align:center;

    box-shadow:0 20px 45px rgba(0,0,0,.5);

    box-sizing:border-box;

}

.logo{
    text-align:center;
    margin-bottom:15px;

}

.logo img{

    width:50px;
    border-radius:20% 10%;

}

.verify-card h2{

    color:#16b364;
    margin-bottom:10px;

}

.verify-card p{

    color:white;
    line-height:1.6;

}

.email{

    color:gold;
    font-size:13px;

}

input{

    width:100%;
    padding:5px;

    margin-top:20px;
    margin-bottom:20px;

    border-radius:10px;
    border:1px solid #ccc;

    text-align:center;

    font-size:15px;
    letter-spacing:6px;

    box-sizing:border-box;

}

input:focus{

    outline:none;
    border-color:#16b364;

    box-shadow:0 0 10px rgba(22,179,100,.4);

}

button{

    width:100%;

    padding:15px;

    margin-top:10px;

    border:none;

    border-radius:12px;

    background:#16b364;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

}

button:hover{

    background:#119455;

}

.resend{

    display:inline-block;

    margin-top:20px;

    color:gold;

    text-decoration:none;

    font-weight:bold;

}

.resend:hover{

    text-decoration:underline;

}

.timer{

    margin-top:25px;

    width:90px;
    height:90px;

    border-radius:50%;

    margin-left:auto;
    margin-right:auto;

    border:2px solid #2eb86a;

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;

    font-size:22px;
    font-weight:bold;

}

.small{

    margin-top:12px;
    color:#bdbdbd;

}
.otp-container{

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:8px;

    width:100%;

    margin:25px 0;

}

.otp-input{

    flex:1;

    max-width:52px;
    height:58px;

    border-radius:12px;

    border:2px solid #ffffff;

    background:#ffffff;

    color:#000;

    text-align:center;

    font-size:24px;

    font-weight:bold;

    box-sizing:border-box;

    transition:.3s;

}

.otp-input:focus{

    border-color:#16b364;

    box-shadow:0 0 12px rgba(22,179,100,.45);

    outline:none;

}

</style>

</head>

<body>

<div class="verify-card">

    <div class="logo">

        <img src="{{ url_for('static', filename='images/supernova earn logo.png') }}">

    </div>

    <h2>Verify OTP</h2>

    <p>

        Enter the verification code sent to

        <br>

        <span class="email">{{ email }}</span>

    </p>

    <form method="POST">

        <div class="otp-container">

            <input
                type="text"
                inputmode="numeric"
                pattern="[0-9]*"
                autocomplete="one-time-code"
                maxlength="1"
                class="otp-input"
            >

            <input
                type="text"
                inputmode="numeric"
                pattern="[0-9]*"
                autocomplete="one-time-code"
                maxlength="1"
                class="otp-input"
            >

            <input
                type="text"
                inputmode="numeric"
                pattern="[0-9]*"
                autocomplete="one-time-code"
                maxlength="1"
                class="otp-input"
            >

            <input
                type="text"
                inputmode="numeric"
                pattern="[0-9]*"
                autocomplete="one-time-code"
                maxlength="1"
                class="otp-input"
            >

            <input
                type="text"
                inputmode="numeric"
                pattern="[0-9]*"
                autocomplete="one-time-code"
                maxlength="1"
                class="otp-input"
            >

            <input
                type="text"
                inputmode="numeric"
                pattern="[0-9]*"
                autocomplete="one-time-code"
                maxlength="1"
                class="otp-input"
            >

        </div>

        <input type="hidden" name="otp" id="otp">

        <button type="submit">

            Verify OTP

        </button>

    </form>

    <a class="resend"
       href="/resend-otp/{{ email }}">

       Resend OTP

    </a>

    <div class="timer">

        <span id="timer">

            05:00

        </span>

    </div>

    <div class="small">

        OTP expires in

    </div>

</div>
<script>

const inputs = document.querySelectorAll(".otp-input");
const hiddenOTP = document.getElementById("otp");

// Move to next input
inputs.forEach((input, index) => {

    input.addEventListener("input", function () {

        // Only allow numbers
        this.value = this.value.replace(/[^0-9]/g, "");

        if(this.value.length === 1 && index < inputs.length - 1){

            inputs[index + 1].focus();

        }

        updateOTP();

    });

    input.addEventListener("keydown", function(e){

        if(e.key === "Backspace" && this.value === "" && index > 0){

            inputs[index - 1].focus();

        }

    });

});

// Paste entire OTP
inputs[0].addEventListener("paste", function(e){

    e.preventDefault();

    const pasted = e.clipboardData.getData("text").replace(/\D/g,"");

    for(let i = 0; i < inputs.length; i++){

        inputs[i].value = pasted[i] || "";

    }

    updateOTP();

});

// Combine all digits
function updateOTP(){

    let code = "";

    inputs.forEach(input =>{

        code += input.value;

    });

    hiddenOTP.value = code;

}

// Prevent incomplete OTP submission
document.querySelector("form").addEventListener("submit", function(e){

    updateOTP();

    if(hiddenOTP.value.length !== 6){

        e.preventDefault();

        alert("Please enter the complete 6-digit OTP.");

    }

});

</script>

<script>

document.addEventListener("DOMContentLoaded", function(){

    let timeLeft = 300;

    const timer = document.getElementById("timer");

    function updateTimer(){

        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;

        if(seconds < 10){

            seconds = "0" + seconds;

        }

        timer.innerHTML = minutes + ":" + seconds;

        if(timeLeft <= 0){

            clearInterval(countdown);

            timer.innerHTML = "Expired";

        }

        timeLeft--;

    }

    const countdown = setInterval(updateTimer,1000);

    updateTimer();

});

</script>

</body>
</html>
