    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body{

    margin:0;

    font-family:Arial, Helvetica, sans-serif;

    background:#000;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;

}

.forgot-card{

    width:340px;
    max-width:90%;

    background:rgb(24,10,42);

    border:1px solid white;

    border-radius:22px;

    padding:35px 25px;

    text-align:center;

    box-shadow:0 20px 45px rgba(0,0,0,.45);

    box-sizing:border-box;

}

.logo2{

    margin-bottom:10px;

}

.logo2 img{

    width:60px;

    border-radius:15px;

}

.forgot-card h2{

    margin:0;

    color:#16b364;

    font-size:30px;

    font-family:Cambria, Cochin, Georgia, Times, "Times New Roman", serif;

}

.subtitle{

    color:white;

    margin:15px 0 25px;

    line-height:1.6;

    font-size:15px;

}

form{

    display:flex;
    flex-direction:column;

}

label{

    text-align:left;

    color:white;

    margin-bottom:8px;

    font-weight:bold;

}

input{

    width:100%;

    padding:14px;

    border-radius:12px;

    border:1px solid #d9d9d9;

    background:white;

    color:black;

    font-size:15px;

    margin-bottom:20px;

    box-sizing:border-box;

}

input:focus{

    outline:none;

    border-color:#16b364;

    box-shadow:0 0 12px rgba(22,179,100,.3);

}

button{

    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;

    background:#16b364;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;

}

button:hover{

    background:#119455;

}

@media(max-width:480px){

    .forgot-card{

        width:92%;

        padding:30px 18px;

    }

}
    </style>
</head>
<body>

<div class="forgot-card">

    <div class="logo2">
        <img src="{{ url_for('static', filename='images/supernova earn logo.png') }}" alt="Supernova Earn">
    </div>

    <h2>Forgot Password</h2>

    <p class="subtitle">
        Enter your registered email address to receive a verification code.
    </p>

    <form method="POST">

        <label>Email Address</label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <button type="submit">
            Send OTP
        </button>

    </form>

</div>

</body>
</html>
</form>
</body>
</html>
