<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}"></script>
<style>



*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Poppins',sans-serif;
    background:#090510;
    color:white;
    overflow-x:hidden;
}

.background{

    width:100%;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:40px;

    position:relative;

    overflow:hidden;

    background:
        radial-gradient(circle at top left,#5634b8 0%,transparent 32%),
        radial-gradient(circle at bottom right,#16b36433 0%,transparent 35%),
        linear-gradient(135deg,#090510,#12091d,#090510);

}

.blob{

    position:absolute;

    border-radius:50%;

    filter:blur(90px);

    opacity:.25;

    animation:floating 12s ease-in-out infinite;

}

.blob1{

    width:340px;
    height:340px;

    background:#16b364;

    top:-120px;
    left:-100px;

}

.blob2{

    width:420px;
    height:420px;

    background:#6d3cff;

    right:-170px;
    bottom:-170px;

    animation-delay:3s;

}

.blob3{

    width:250px;
    height:250px;

    background:#ffd54a;

    right:25%;
    top:40%;

    animation-delay:6s;

}

@keyframes floating{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-35px);

}

}

.auth-card{

    width:100%;

    max-width:1180px;

    min-height:620px;

    height:auto;

    display:flex;

    overflow:hidden;

    border-radius:32px;

    background:rgba(255,255,255,.05);

    backdrop-filter:blur(18px);

    border:2px solid rgb(255, 255, 255);

    box-shadow:0 35px 80px rgba(0,0,0,.45);

}


/*================ LEFT PANEL ================*/

.left-panel{

    flex:1;

    display:flex;

    flex-direction:column;

    justify-content:center;
    align-items: center;

    padding:45px;

    background: rgb(24, 10, 42);

}

.main-logo{

    width:110px;
    height:110px;

    object-fit:contain;

    margin-bottom:35px;

}

.left-panel h1{

    font-size:44px;

    font-weight:800;

    margin-bottom:10px;

}

.left-panel h2{

    font-size:28px;

    color:#F6C000;

    margin-bottom:25px;

    font-weight:700;

}

.left-description{

    max-width:480px;

    font-size:20px;

    line-height:1.8;

    color:#dddddd;
    text-align: center;

}

/*=========================================================
                    RIGHT PANEL
=========================================================*/

.right-panel{

    flex:1;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:60px;
    background: rgb(24, 10, 42);

}

.form-card{

    width:100%;

    max-width:440px;

    display:flex;

    flex-direction:column;

    justify-content:center;

}

.form-logo{

    width:90px;

    height:90px;

    object-fit:contain;

    margin:0 auto 18px;

}

.form-card h2{

    text-align:center;

    font-size:40px;

    font-weight:700;

    margin-bottom:8px;

}

.subtitle{

    text-align:center;

    color:#d0d0d0;

    font-size:16px;

    line-height:1.8;

    margin-bottom:40px;

}

/*================ FORM =================*/

.login-form{

    display:flex;

    flex-direction:column;

    gap:18px;

}

.input-group{

    display:flex;

    flex-direction:column;

    gap:8px;

}

.input-group label{

    font-size:15px;

    font-weight:600;

    color:#ffffff;

}

/*================ UNDERLINE INPUTS =================*/

.input-group input{

    width:100%;

    background:transparent;

    border:none;

    border-bottom:2px solid rgba(255,255,255,.25);

    padding:14px 5px;

    color:white;

    font-size:16px;

    transition:.3s;

}

.input-group input::placeholder{

    color:#888;

}

.input-group input:focus{

    outline:none;

    border-bottom:2px solid #F6C000;

}

/*================ PASSWORD =================*/

.password-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

}

.password-header a{

    color:#F6C000;

    text-decoration:none;

    font-size:14px;

}

.password-header a:hover{

    text-decoration:underline;

}

.password-box{

    position:relative;

}

.password-box input{

    padding-right:40px;

}

.password-toggle{

    position:absolute;

    right:0;

    top:50%;

    transform:translateY(-50%);

    cursor:pointer;

}

.password-toggle img{

    width:22px;

}

/*================ REMEMBER =================*/

.remember-box{

    display:flex;

    align-items:center;

    gap:10px;

    margin-top:5px;

}
.remember-box input{
    width: 20px;
    height: 20px;
}
.remember-box label{

    color:#d5d5d5;

    font-size:14px;

}

/*================ BUTTON =================*/

.login-btn{

    margin-top:20px;

    height:56px;

    border:none;

    border-radius:14px;

    background:linear-gradient(90deg,#0D6EFD,#2F80ED);

    color:white;

    font-size:18px;

    font-weight:700;

    cursor:pointer;

    transition:.35s;

}

.login-btn:hover{

    transform:translateY(-3px);

    box-shadow:0 12px 30px rgba(47,128,237,.45);

}

/*================ LOGIN LINK =================*/

.login-link{

    text-align:center;

    margin-top:30px;

    color:#d5d5d5;

}

.login-link a{

    color:#F6C000;

    text-decoration:none;

    font-weight:700;

}

.login-link a:hover{

    text-decoration:underline;

}


.top1{
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    
    gap: 5px;
}
.img{
    display: flex;
}
.top1-left{
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

/*=========================================================
                    RESPONSIVE
=========================================================*/

/*================ LARGE TABLETS =================*/

@media (min-width:901px){

.auth-card{

    zoom: 75%;

}

.left-panel{

    padding:45px;

}

.right-panel{

    padding:40px;

}

.left-panel h1{

    font-size:34px;

}

.left-panel h2{

    font-size:26px;

}

}

/*================ TABLETS =================*/

@media (max-width:900px){

.background{

    padding:25px;

}

.auth-card{

    flex-direction:column;

    max-width:500px;

    height:auto;

    

}

.left-panel{

    display:none;

}

.right-panel{
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    width:100%;

    padding:35px 30px;

}

.form-card{
    flex-direction: column;
    width:100%;

    max-width:100%;

}

}

/*================ MOBILE =================*/

@media (max-width:600px){

.background{

    padding:15px;

}

.auth-card{
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    border-radius:22px;
    margin: 0;


}

.right-panel{

    width: 100%;
    background-color: #16b364;

}

.form-card{

    width:100%;
    max-width: 100%;

}

.form-logo{

    width:70px;

    height:70px;

    border-radius: 50%;

  

}

.form-card h2{

    font-size:28px;

}

.subtitle{

    font-size:14px;

   

}

.login-form{

    gap:14px;

}

.input-group{

    margin-bottom:0;

}

.input-group input{

    font-size:15px;

    padding:12px 3px;

}

.password-header{

    flex-direction:row;

    align-items:center;

}

.password-header a{

    font-size:13px;

}

.remember-box{

    margin-top:5px;

}

.login-btn{

    height:50px;

    font-size:16px;

}

.login-link{

    margin-top:22px;

    font-size:14px;
    background-color: red;

}
.top1{

  
    background-color: red;
    
}
}


   </style>
</head>
<body>

<div class="background">

    <span class="blob blob1"></span>
    <span class="blob blob2"></span>
    <span class="blob blob3"></span>

    <div class="auth-card">

        <!-- LEFT PANEL -->

        <div class="left-panel">



            <h1>SUPERNOVA EARN</h1>

            <h2>WELCOME BACK</h2>

            
            <p class="left-description">

            We are happy to have you with us again.Sign in to access your dashboard and continue building your financial future with confidence.

            </p>
            


        </div>

        <!-- RIGHT PANEL -->
        <div class="right-panel">

            <div class="form-card">
                <div class="top1">
                        <div class="img">
                            <img
                                src="{{ url_for('static', filename='images/supernova earn logo.png') }}"
                                class="form-logo"
                                alt="Logo">
                        </div>    
                        <div class="top-left">
                            <h2>Sign In</h2>

                            <p class="subtitle">
                                Welcome back! Login to continue earning with Supernova Earn.
                            </p>
                        </div>
                </div>
                <form class="login-form" action="/login" method="POST">

                    <div class="input-group">

                        <label>Username or Email</label>

                        <input
                            type="text"
                            name="login"
                            placeholder="Username or Email"
                           
                            required>

                    </div>

                    <div class="input-group">

                        <div class="password-header">

                            <label>Password</label>

                            <a href="/forgot-password">
                                Forgot password?
                            </a>

                        </div>

                        <div class="password-box">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="••••••••"
                                autocomplete="new-password"
                                required>

                            <span
                                class="password-toggle"
                                onclick="togglePassword()">

                                <img
                                    id="eyeIcon"
                                    src="{{ url_for('static', filename='images/close-eye.jfif') }}"
                                    alt="Toggle Password">

                            </span>

                        </div>

                    </div>

                    <div class="remember-box">

                        <input
                            type="checkbox"
                            id="remember_me"
                            name="remember_me">

                        <label for="remember_me">
                            Remember Me
                        </label>

                    </div>

                    <button
                        type="submit"
                        class="login-btn">

                        Sign In

                    </button>

                    <div class="login-link">

                        Don't have an account?

                        <a href="/signup">

                            Create New Account

                        </a>

                    </div>

                </form>

            </div>

        </div>



    </div>

</div>
</html>
