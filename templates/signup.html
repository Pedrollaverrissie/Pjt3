<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login-page</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
   <script src="{{ url_for('static', filename='script.js') }}"></script>
   <style>
    .email-exists-overlay{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.6);

    backdrop-filter:blur(6px);

    display:flex;

    justify-content:center;

    align-items:center;

    z-index:99999;

}

.email-exists-popup{

    position:relative;

    width:330px;

    max-width:85%;

    background:white;

    border-radius:20px;

    padding:30px 25px;

    text-align:center;

    animation:popupShow .35s ease;

    box-shadow:0 20px 50px rgba(0,0,0,.35);

}

.email-exists-popup img{

    width:75px;

    height:75px;

    border-radius:50%;

    margin-bottom:20px;

}

.email-exists-popup h2{

    color:#d32f2f;

    margin-bottom:15px;

}

.email-exists-popup p{

    color:#666;

    line-height:1.7;

    margin-bottom:25px;

}

.email-login-btn{

    display:block;

    background:#16b364;

    color:white;

    text-decoration:none;

    padding:14px;

    border-radius:10px;

    font-weight:bold;

}

.email-login-btn:hover{

    background:#119455;

}

.email-exists-close{

    position:absolute;

    top:12px;

    right:12px;

    width:34px;

    height:34px;

    border:none;

    border-radius:50%;

    cursor:pointer;

    font-size:22px;

    background:#eee;

}

.email-exists-close:hover{

    background:#d32f2f;

    color:white;

}

@keyframes popupShow{

    from{

        opacity:0;

        transform:scale(.8);

    }

    to{

        opacity:1;

        transform:scale(1);

    }

}
   </style>
</head>
<body>
   

    <div class="container-signup">
       
         <form class="signup-page" action="/signup" method="POST">  
            <div class="login-header">
                    <div class="top2">
                        <div class="login-logo"><img src="static/images/supernova earn logo.png" alt=""></div>
                        <div class="web-name">
                            <h3>SUPERNOVA EARN</h3>
                            <p>Sign up a new account</p>
                        </div>
                    </div>
                        <div class="notice2">
                            <img class="admin" src="static/images/admin.jfif" alt="">
                                <p>Invented by <span>Admin</span></p>
                        </div>
            </div> 
            
            <div class="identity">
                <label for="">Username <span class="bracket"></span></label>
                <input name="username" type="text" placeholder="Your display name" required>

                <label for="">Email</label>
                <input type="email" placeholder="yourname@gmail.com" name="email" required>

                <label for="">Phone number</label>
                <input 
                    
                    type="tel" 
                    name="phone" 
                    placeholder="07XXXXXXXX or 01XXXXXXXX"
                    pattern="^(07|01)\d{8}$"
                    required
                    >
                

                <label for="">Password</label>
                <div class="show-password2">
                    <input type="password"  id="password" placeholder="Min. 6 characters" name="password" required>
                    <div class="eye2" onclick="togglePassword()" ><img id="eyeIcon"  src="static/images/close-eye.jfif" alt=""></div> 
                </div>

            
                <div class="checkbox2">
                    <input type="checkbox" name="terms" require>
                    <p>I agree to the <span class="signup-span">Terms of Service </span>and <span class="signup-span">No-Refund Policy</span></p>
                </div>
            </div>

            <button class="create-account" type="submit">Create Account</button>
            <div class="signup-line"></div>
            <p class="signup-root">Already  have an account? <a href="/login" target="_blank">Sign in</a></span></p>
                <input
                    type="hidden"
                    name="referral_code"
                    value="{{ ref }}"
                >
         </form>    
    </div> 
    
    {% if email_exists %}

<div class="email-exists-overlay">

    <div class="email-exists-popup">

        <button class="email-exists-close"
                onclick="closeEmailPopup()">

            &times;

        </button>

        <img src="{{ url_for('static', filename='images/alert.jfif') }}">

        <h2>Email Already Registered</h2>

        <p>

            This email is already associated with an account.

            Please login instead.

        </p>

        <a href="/login" class="email-login-btn">

            Go to Login

        </a>

    </div>

</div>

{% endif %}
</body>
</html>
